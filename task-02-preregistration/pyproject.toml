[project]
name = "demand-prereg"
version = "1.0.0"
description = "Preregistered analysis: do marketing events raise daily demand? (RabTech Academy DS internship, Task 2)"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demand_prereg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
