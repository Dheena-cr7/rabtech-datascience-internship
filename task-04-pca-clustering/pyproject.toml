[project]
name = "wine-pca-clustering"
version = "1.0.0"
description = "RabTech Academy DS internship, Task 4: PCA, K-Means, DBSCAN and hierarchical clustering"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
    "plotly>=5.24",
    "kneed>=0.8.5",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
