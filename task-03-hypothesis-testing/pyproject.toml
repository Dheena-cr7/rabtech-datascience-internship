[project]
name = "penguin-hypothesis-testing"
version = "1.0.0"
description = "RabTech Academy DS internship, Task 3: normality tests, t-tests, Mann-Whitney U, one- and two-way ANOVA with Tukey HSD"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14.4",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
    "pingouin>=0.5.5",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[tool.uv]
package = false
