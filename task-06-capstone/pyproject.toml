[project]
name = "churn-capstone"
version = "1.0.0"
description = "RabTech Academy DS internship, Task 6 capstone: profit-driven customer churn prediction"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "pypdfium2>=4.30",
    "jupyterlab>=4.2",
    "nbclient>=0.10",
    "nbformat>=5.10",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/churn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
